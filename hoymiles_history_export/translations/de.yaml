configuration:
  hoymiles_user:
    name: Hoymiles-Benutzername
    description: >-
      E-Mail-Adresse deines Hoymiles-/S-Miles-Cloud-Accounts (dieselbe wie in
      der Hoymiles-App).
  hoymiles_password:
    name: Hoymiles-Passwort
    description: Passwort deines Hoymiles-/S-Miles-Cloud-Accounts.
  hoymiles_plant_id:
    name: Anlagen-ID (Plant ID)
    description: >-
      Deine Hoymiles-Anlagen-/Station-ID, z.B. sichtbar in der Hoymiles-App
      oder in euren bestehenden Entitäten
      (sensor.hoymiles_gateway_solarh_<plant_id>_...).
  statistic_id:
    name: Ziel-Sensor (Statistik-ID)
    description: >-
      Die Home-Assistant-Energiestatistik, die aufgefüllt werden soll, z.B.
      sensor.hoymiles_gateway_solarh_3023680_today_eq. Sollte ein
      total_increasing/total-Energiesensor sein (typisch der
      "heute produziert"-Zähler eurer Hoymiles-Integration).
  start_date:
    name: Startdatum (JJJJ-MM-TT) - optional
    description: >-
      Erster Tag der Lücke, die aufgefüllt werden soll, im Format
      JJJJ-MM-TT (z.B. 2025-09-07). Leer lassen, um den History-Backfill
      komplett zu überspringen (z.B. wenn nur der Live-Modus genutzt werden
      soll). Kein Kalender-Auswahlfeld möglich – das unterstützt das
      Home-Assistant-Add-on-System technisch nicht, daher bitte als Text
      eingeben.
  end_date:
    name: Enddatum (JJJJ-MM-TT) - optional
    description: >-
      Letzter Tag der Lücke (eingeschlossen), im Format JJJJ-MM-TT
      (z.B. 2026-09-16). Für nur einen einzelnen Tag: gleiches Datum wie
      Startdatum eintragen. Leer lassen, um den History-Backfill zu
      überspringen.
  unit_of_measurement:
    name: Einheit
    description: >-
      Einheit eures Ziel-Sensors, in aller Regel kWh unverändert lassen.
  time_zone:
    name: Zeitzone
    description: >-
      Eure Home-Assistant-Zeitzone (muss passen, damit Tagesgrenzen korrekt
      liegen), z.B. Europe/Berlin.
  days_per_batch:
    name: Tage pro Import-Durchlauf
    description: >-
      Wie viele Tage vor jedem Import-Aufruf verarbeitet werden. Der
      Standardwert (30) ist ein vernünftiges, rücksichtsvolles Tempo
      gegenüber den Hoymiles-Servern.
  enable_live_gateway:
    name: Live-Gateway aktivieren
    description: >-
      Nach dem (optionalen) History-Backfill dauerhaft weiterlaufen und
      Live-Daten von Hoymiles abrufen + per MQTT veröffentlichen – als
      Ersatz für das Original-"HoyMiles Solar Gateway"-Add-on, das dabei
      Bugs hat (kein Netzwerk-Timeout, teils 16+ Stunden Totalausfall bei
      MQTT-Problemen). Nutzt dieselben MQTT-Themen, bestehende Entitäten
      bleiben erhalten. Braucht das Mosquitto-Broker-Add-on.
  poll_interval_seconds:
    name: Abfrage-Intervall (Sekunden)
    description: >-
      Nur relevant, wenn Live-Gateway aktiviert ist: wie oft (in Sekunden)
      Hoymiles nach neuen Live-Daten gefragt wird. Standard 480 (8 Minuten),
      entspricht dem Original-Add-on.
